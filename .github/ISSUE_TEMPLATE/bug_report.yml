name: Bug report
description: Something doesn't work as documented, or the film comes out wrong
title: "<area>: <what goes wrong>"
labels: ["type: bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please give the title the form **`area: what goes wrong`**, for example
        `read-back: Japanese lines always score a perfect match`. Remove anything private from configs and logs.
        Security problems go to [a private advisory](https://github.com/dassjaylabs/filmwright/security/advisories/new), not here.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [voice, read-back check, music / sound effects, demo recording, explainer (story or montage), both (hybrid), presenter / lip sync, export / outputs / stems, CLI / reel.yaml / wizard, setup / doctor, docs, not sure]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what you got. Include the error text if there was one.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest reel.yaml (and story, scenario or film file) plus the command that shows the problem.
      placeholder: |
        1. filmwright new demo-film --mode explainer --voice preset --yes
        2. edit ...
        3. filmwright build demo-film
    validations: {required: true}
  - type: textarea
    id: config
    attributes:
      label: reel.yaml
      render: yaml
  - type: dropdown
    id: voice
    attributes:
      label: Voice type
      options: [preset, described, clone, system, not relevant]
  - type: input
    id: language
    attributes:
      label: Narration language
      placeholder: english
  - type: textarea
    id: doctor
    attributes:
      label: Output of `filmwright doctor`
      description: Shows your OS, Python, ffmpeg, browser and voice setup.
      render: text
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: filmwright version
      placeholder: "filmwright --version, or the commit you installed from"
    validations: {required: true}
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I removed tokens, private URLs and anyone's personal data from what I pasted.
          required: true
