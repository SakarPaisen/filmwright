name: CLA
# Asks first-time contributors to sign CLA.md by commenting on their pull request. Signatures are stored in
# signatures/version1/cla.json on the unprotected `cla-signatures` branch. This workflow never checks out or runs
# pull-request code, which is what makes pull_request_target safe here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08   # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/dassjaylabs/filmwright/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dassjaylabs,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for your pull request! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/dassjaylabs/filmwright/blob/main/CLA.md) and sign it by
            commenting below with the exact sentence that follows. You only need to do this once.
