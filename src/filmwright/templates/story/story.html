<!doctype html>
<!-- filmwright story template (MIT). One short character-led film per use case.
     Inputs (injected before load): window.UC (story + brand config), window.BEATS (narration timing).
     Output: window.TOTAL, window.SFX, window.renderAt(t), window.READY. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Space Grotesk";src:url("../../assets/fonts/SpaceGrotesk-Variable.ttf") format("truetype");font-weight:300 700}
@font-face{font-family:"IBM Plex Sans";src:url("../../assets/fonts/IBMPlexSans-Regular.ttf") format("truetype");font-weight:400 500}
@font-face{font-family:"IBM Plex Sans";src:url("../../assets/fonts/IBMPlexSans-SemiBold.ttf") format("truetype");font-weight:600}
@font-face{font-family:"IBM Plex Sans";src:url("../../assets/fonts/IBMPlexSans-Bold.ttf") format("truetype");font-weight:700}
@font-face{font-family:"Caveat";src:url("../../assets/fonts/Caveat-Variable.ttf") format("truetype");font-weight:400 700}
html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#0f1222}
svg{display:block}
</style>
<script src="../../assets/motion.js"></script>
<script src="../../assets/vendor/rough.js"></script>
</head><body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF1FF"/><stop offset="1" stop-color="#DCE2FA"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93B9F5"/><stop offset="1" stop-color="#DCE9FB"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" class="acc" stop-opacity=".55"/><stop offset=".55" class="acc" stop-opacity=".16"/><stop offset="1" class="acc" stop-opacity="0"/></radialGradient>
    <radialGradient id="darkglow" cx="0.5" cy="0.45" r="0.75"><stop offset="0" id="dg0"/><stop offset=".6" id="dg1"/><stop offset="1" id="dg2"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10132a" flood-opacity=".18"/></filter>
    <filter id="softdark" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle id="dotc" cx="2" cy="2" r="1.6" opacity=".55"/></pattern>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#E7E9F0" stroke-width="1.5"/></pattern>
  </defs>
  <g id="product"></g>
  <g id="app"></g>
  <g id="board"></g>
  <g id="office"></g>
  <g id="outro"></g>
  <g id="fx"></g>
</svg>
<script>
/* ---------- helpers ---------- */
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
function S(tag, attrs = {}, parent = null, text = null) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
let seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
const hex = h => { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const mix = (a, b, k) => { const x = hex(a), y = hex(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, "0")).join(""); };

/* ---------- config ---------- */
const UC = window.UC || {};
const BR = Object.assign({wordmark: "ACME", tagline: "Plan less. Do more.", colors: {}}, UC.brand || {});
const BC = Object.assign({bg: "#0f1222", accent: "#7c5cff", alt: "#22c55e", warm: "#ff8a4c", ink: "#f4f5fb"}, BR.colors || {});
const C = {
  bg: BC.bg, panel: mix(BC.bg, "#ffffff", .045), panel2: mix(BC.bg, "#ffffff", .09), line: mix(BC.bg, BC.accent, .28),
  accent: BC.accent, accent2: mix(BC.accent, "#ffffff", .28), soft: mix(BC.accent, "#ffffff", .72),
  alt: BC.alt, warm: BC.warm, sun: "#FFC247", coral: "#FF6B5B", red: "#E5484D", ink: "#1F2533", dark: "#141729",
  text: BC.ink, muted: mix(BC.ink, BC.bg, .38), paper: "#FFFFFF",
  skin: UC.skin || "#C98B6B", skin2: UC.skin2 || "#B4785A", hair: UC.hair || "#2A1A16"};
const SH = UC.shirt || C.accent, SH2 = UC.shirt2 || mix(SH, "#000000", .18);
const FONT = {disp: "Space Grotesk, Arial, sans-serif", body: "IBM Plex Sans, Arial, sans-serif", hand: "Caveat, cursive"};
const PILE = Object.assign({label: "Requests this week", count: 240, item: "note"}, UC.pile || {});
const SETUP = Object.assign({inputs: [["calendar", "Calendars"], ["chat", "Chat"], ["mail", "Email"], ["sheet", "Spreadsheets"], ["upload", "Forms"]],
  items: [["Team calendar", ["12 people", "3 shifts", "Live"]], ["Requests inbox", ["Sorted", "Owner set", "Due dates"]], ["Rota rules", ["Fair share", "Holidays", "Skills"]]],
  badge: "Always up to date"}, UC.setup || {});
const APP = Object.assign({kind: "chat", title: "Team space", request: "Build next week's on-call rota",
  result: [["Rota ready: 12 people, 21 shifts", "Nobody works two weekends in a row."], ["2 swaps suggested", "Both people already agreed."]],
  cards: [["Shift rules", "Updated today"], ["Holiday calendar", "3 people away"]],
  fields: [["Team", "Support"], ["Week", "Next week"], ["Cover", "24/7"]],
  metrics: [["Tasks done", 128, "+24%"], ["On time", 96, "%"], ["Hours saved", 14, "this week"]],
  steps: ["Collect availability", "Apply the rota rules", "Balance the weekends", "Share with the team"],
  button: "Run"}, UC.app || {});
const PING = Object.assign({from: "Your manager", label: "Need this by 5 pm:", meeting: "Review meeting", meetingTime: "5:00 PM", initials: "MG"}, UC.ping || {});
const SFX = [];
const cue = (t, name) => SFX.push([+t.toFixed(3), name]);
document.querySelectorAll(".acc").forEach(s => s.setAttribute("stop-color", C.accent));
$("dg0").setAttribute("stop-color", mix(BC.bg, BC.accent, .3)); $("dg1").setAttribute("stop-color", mix(BC.bg, BC.accent, .08)); $("dg2").setAttribute("stop-color", mix(BC.bg, "#000000", .25));
$("dotc").setAttribute("fill", mix(BC.bg, BC.accent, .45));

/* ---------- beat timing (injected by the renderer; defaults for preview) ---------- */
const BEATS = window.BEATS || [{key:"meet",start:.5,dur:4.6},{key:"pile",start:5.3,dur:5.2},{key:"cost",start:10.7,dur:3.5},{key:"workaround",start:14.4,dur:5.2},{key:"setup",start:19.9,dur:7},{key:"result",start:27.2,dur:7.3}];
const B = Object.fromEntries(BEATS.map(b => [b.key, b]));
const ARCH = UC.arch || "A";
if (ARCH === "C") {   // before/after: the whiteboard runs in the "before" window, the setup scene in "after"
  const bf = B.before;
  B.pile = {key: "pile", start: bf.start, dur: 0};
  B.cost = {key: "cost", start: bf.start, dur: bf.dur * .45};
  B.workaround = {key: "workaround", start: bf.start + bf.dur * .45, dur: bf.dur * .55};
  B.setup = B.after;
}
if (!B.meet) B.meet = {key: "meet", start: B.pile.start, dur: 0};
// the result scene needs about 7.4 s for its payoff (answer, happy avatar, confetti) even when the line is short
const RD = Math.max(B.result.dur, 7.4);
const TOTAL = B.result.start + RD + 2.6;

const tl = motion.timeline({paused: true});

/* ---------- the person (head centre cx, cy) ---------- */
function hairBack(p, cx, cy) {
  const st = UC.style;
  if (st === "bun") { S("ellipse", {cx, cy: cy - 36, rx: 96, ry: 90, fill: C.hair}, p); S("circle", {cx, cy: cy - 128, r: 44, fill: C.hair}, p); }
  if (st === "long") S("path", {d: `M${cx - 100} ${cy - 20} C${cx - 110} ${cy - 120} ${cx + 110} ${cy - 120} ${cx + 100} ${cy - 20} L${cx + 104} ${cy + 140} C${cx + 60} ${cy + 160} ${cx - 60} ${cy + 160} ${cx - 104} ${cy + 140} Z`, fill: C.hair}, p);
  if (st === "short") S("ellipse", {cx, cy: cy - 34, rx: 88, ry: 78, fill: C.hair}, p);
  if (st === "curly") for (const [dx, dy, r] of [[-60, -70, 40], [0, -96, 46], [60, -70, 40], [-86, -20, 32], [86, -20, 32], [-34, -100, 34], [34, -100, 34]]) S("circle", {cx: cx + dx, cy: cy + dy, r, fill: C.hair}, p);
  if (st === "buzz") S("ellipse", {cx, cy: cy - 26, rx: 82, ry: 70, fill: C.hair}, p);
}
function hairFront(p, cx, cy) {
  const st = UC.style, T = (d) => d.replace(/(-?\d+) (-?\d+)/g, (m, x, y) => `${+x + cx} ${+y + cy}`);
  if (st === "bun" || st === "long") S("path", {d: T("M-80 -28 C-66 -96 30 -114 82 -48 C48 -60 2 -60 -30 -32 C-46 -18 -68 -16 -80 -28 Z"), fill: C.hair}, p);
  if (st === "short") S("path", {d: T("M-82 -20 C-80 -90 80 -100 84 -24 C60 -54 -20 -66 -82 -20 Z"), fill: C.hair}, p);
  if (st === "curly") S("path", {d: T("M-74 -30 C-60 -70 60 -70 74 -30 C40 -46 -40 -46 -74 -30 Z"), fill: C.hair}, p);
  if (st === "buzz") S("path", {d: T("M-78 -24 C-70 -70 70 -70 78 -24 C40 -40 -40 -40 -78 -24 Z"), fill: C.hair, opacity: .9}, p);
}
function glasses(p, cx, cy) { if (UC.glasses) for (const dx of [-30, 30]) S("circle", {cx: cx + dx, cy: cy + 10, r: 22, fill: "none", stroke: C.ink, "stroke-width": 5}, p); }
/* fit a handwritten label to a width (Caveat is about 0.42 em per character) */
const fitHand = (txt, max, width) => Math.min(max, Math.floor(width / (Math.max(1, txt.length) * .42)));

/* a pile item: sticky note, document, envelope or ticket */
function pileItem(parent, kind, i) {
  const d = S("g", {}, parent);
  if (kind === "doc") {
    S("rect", {x: -36, y: -46, width: 72, height: 92, rx: 6, fill: "#FFFFFF", stroke: "#CDD3E4", "stroke-width": 2}, d);
    for (let k = 0; k < 4; k++) S("rect", {x: -24, y: -30 + k * 14, width: k === 0 ? 34 : 48 - (k % 2) * 12, height: 5, rx: 2.5, fill: k === 0 ? C.accent2 : "#D7DCEA"}, d);
  } else if (kind === "mail") {
    S("rect", {x: -40, y: -27, width: 80, height: 54, rx: 7, fill: "#FFFFFF", stroke: "#CDD3E4", "stroke-width": 2}, d);
    S("path", {d: "M-38 -24 L0 6 L38 -24", stroke: C.accent2, "stroke-width": 3, fill: "none"}, d);
  } else if (kind === "ticket") {
    S("rect", {x: -42, y: -26, width: 84, height: 52, rx: 8, fill: "#FFFFFF", stroke: "#CDD3E4", "stroke-width": 2}, d);
    S("circle", {cx: -26, cy: 0, r: 9, fill: [C.warm, C.alt, C.accent2][i % 3]}, d);
    for (let k = 0; k < 2; k++) S("rect", {x: -10, y: -10 + k * 16, width: 40 - k * 12, height: 6, rx: 3, fill: "#D7DCEA"}, d);
  } else {   // sticky note
    const col = ["#FFE08A", "#FFC9B5", "#C8F0D8", "#D9D2FF"][i % 4];
    S("rect", {x: -38, y: -38, width: 76, height: 76, rx: 4, fill: col, stroke: mix(col, "#000000", .12), "stroke-width": 2}, d);
    for (let k = 0; k < 3; k++) S("rect", {x: -26, y: -18 + k * 14, width: 52 - (k % 2) * 16, height: 5, rx: 2.5, fill: mix(col, "#000000", .22)}, d);
  }
  return d;
}

/* ================= SCENE 1-2: OFFICE (character + flat 2D) ================= */
function buildOffice() {
  const g = $("office");
  const cam = S("g", {id: "cam"}, g);
  S("rect", {x: 0, y: 0, width: 1920, height: 1080, fill: "url(#wall)"}, cam);
  // window with skyline
  const win = S("g", {}, cam);
  S("rect", {x: 1230, y: 150, width: 440, height: 380, rx: 18, fill: "#FFFFFF"}, win);
  S("rect", {x: 1250, y: 170, width: 400, height: 340, rx: 10, fill: "url(#sky)"}, win);
  const clouds = S("g", {id: "clouds"}, win);
  for (const [x, y, s] of [[1300, 230, 1], [1500, 270, .8], [1610, 215, .6]]) {
    const c = S("g", {transform: `translate(${x},${y}) scale(${s})`}, clouds);
    S("ellipse", {cx: 0, cy: 0, rx: 46, ry: 18, fill: "#FFFFFF", opacity: .9}, c);
    S("ellipse", {cx: 22, cy: -12, rx: 28, ry: 18, fill: "#FFFFFF", opacity: .9}, c);
  }
  const city = [[1260, 400, 60, 110], [1325, 360, 52, 150], [1382, 420, 44, 90], [1430, 330, 70, 180], [1505, 390, 50, 120], [1560, 350, 46, 160], [1610, 410, 40, 100]];
  for (const [x, y, w, h] of city) S("rect", {x, y, width: w, height: h, fill: "#86A7E8", opacity: .55}, win);
  S("rect", {x: 1250, y: 336, width: 400, height: 8, fill: "#FFFFFF"}, win);
  S("rect", {x: 1446, y: 170, width: 8, height: 340, fill: "#FFFFFF"}, win);
  // shelf with books and a frame
  const shelf = S("g", {}, cam);
  S("rect", {x: 250, y: 330, width: 420, height: 14, rx: 7, fill: "#BCC4DE"}, shelf);
  const books = [[C.accent, 34, 110], [C.sun, 28, 92], [C.alt, 40, 120], [C.coral, 26, 86], [C.accent2, 36, 104]];
  let bx = 280;
  for (const [col, w, h] of books) { S("rect", {x: bx, y: 330 - h, width: w, height: h, rx: 5, fill: col}, shelf); bx += w + 8; }
  S("rect", {x: 540, y: 220, width: 110, height: 110, rx: 10, fill: "#FFFFFF"}, shelf);
  S("path", {d: "M556 312 L590 262 L612 290 L626 274 L640 312 Z", fill: C.soft}, shelf);
  S("circle", {cx: 620, cy: 245, r: 10, fill: C.sun}, shelf);
  // floor
  S("rect", {x: 0, y: 900, width: 1920, height: 180, fill: "#CBD2EC"}, cam);
  S("ellipse", {cx: 960, cy: 935, rx: 520, ry: 30, fill: "#B4BEE0"}, cam);

  // stacks of work (grow in scene 2), behind the desk
  const towers = S("g", {id: "towers"}, cam);
  const towerDefs = [[250, 900, 150, 430], [420, 900, 120, 300], [1450, 900, 140, 380], [1610, 900, 160, 470]];
  towerDefs.forEach(([x, base, w, h], i) => {
    const t = S("g", {class: "tower", "data-h": h}, towers);
    S("rect", {x, y: base - h, width: w, height: h, rx: 6, fill: "#FFFFFF", filter: "url(#soft)"}, t);
    for (let yy = base - h + 14; yy < base; yy += 16) S("line", {x1: x + 6, y1: yy, x2: x + w - 6, y2: yy, stroke: "#D6DBEA", "stroke-width": 2}, t);
    motion.set(t, {scaleY: 0, svgOrigin: `${x + w / 2} ${base}`});
  });

  // ---- the person ----
  const person = S("g", {id: "person"}, cam);
  S("rect", {x: 830, y: 470, width: 260, height: 330, rx: 40, fill: "#1E2338"}, person); // chair back
  const body = S("g", {id: "pbody"}, person);
  S("path", {d: "M820 800 C820 668 850 616 960 604 C1070 616 1100 668 1100 800 Z", fill: SH}, body);
  S("path", {d: "M960 604 C1070 616 1100 668 1100 800 L1010 800 C1030 700 1010 640 960 604 Z", fill: SH2}, body);
  S("path", {d: "M928 606 L960 652 L992 606 Z", fill: "#EEF0FA"}, body);
  S("rect", {x: 938, y: 562, width: 44, height: 52, rx: 14, fill: C.skin2}, body);
  const head = S("g", {id: "phead"}, person);
  hairBack(head, 960, 506);
  S("circle", {cx: 884, cy: 516, r: 15, fill: C.skin2}, head);
  S("circle", {cx: 1036, cy: 516, r: 15, fill: C.skin2}, head);
  S("ellipse", {cx: 960, cy: 506, rx: 78, ry: 88, fill: C.skin}, head);
  hairFront(head, 960, 506);
  S("circle", {cx: 926, cy: 548, r: 13, fill: "#E8907C", opacity: .45}, head);
  S("circle", {cx: 994, cy: 548, r: 13, fill: "#E8907C", opacity: .45}, head);
  glasses(head, 960, 506);
  const eyes = S("g", {id: "peyes"}, head);
  for (const x of [930, 990]) { S("ellipse", {cx: x, cy: 516, rx: 8.5, ry: 11, fill: "#1A1A24"}, eyes); S("circle", {cx: x + 3, cy: 512, r: 2.6, fill: "#FFFFFF"}, eyes); }
  motion.set(eyes, {svgOrigin: "960 516"});
  const brows = S("g", {id: "pbrows"}, head);
  const bl = S("path", {d: "M914 492 Q930 484 946 490", stroke: C.hair, "stroke-width": 6, "stroke-linecap": "round", fill: "none"}, brows);
  const br = S("path", {d: "M974 490 Q990 484 1006 492", stroke: C.hair, "stroke-width": 6, "stroke-linecap": "round", fill: "none"}, brows);
  motion.set(bl, {svgOrigin: "930 490"}); motion.set(br, {svgOrigin: "990 490"});
  S("path", {d: "M958 528 Q954 540 962 542", stroke: "#A2664B", "stroke-width": 4, "stroke-linecap": "round", fill: "none"}, head);
  S("path", {id: "psmile", d: "M934 560 Q960 584 986 560", stroke: "#7A2E2E", "stroke-width": 5.5, "stroke-linecap": "round", fill: "none"}, head);
  S("path", {id: "pworry", d: "M940 572 Q960 558 980 572", stroke: "#7A2E2E", "stroke-width": 5.5, "stroke-linecap": "round", fill: "none", opacity: 0}, head);
  motion.set(head, {svgOrigin: "960 604"});   // the head pivots on the neck
  // arms belong to the torso, so they rise and fall with each breath instead of floating free
  S("path", {d: "M862 650 Q826 712 892 744", stroke: SH, "stroke-width": 50, "stroke-linecap": "round", fill: "none"}, body);
  S("path", {d: "M1058 650 Q1094 712 1028 744", stroke: SH2, "stroke-width": 50, "stroke-linecap": "round", fill: "none"}, body);
  // desk
  const desk = S("g", {}, cam);
  S("rect", {x: 500, y: 730, width: 920, height: 36, rx: 12, fill: "#2E3550"}, desk);
  S("rect", {x: 540, y: 766, width: 840, height: 150, rx: 8, fill: "#262C45"}, desk);
  S("rect", {x: 540, y: 766, width: 840, height: 12, fill: "#1D2238"}, desk);
  const laptop = S("g", {}, cam);
  S("rect", {x: 862, y: 612, width: 196, height: 120, rx: 12, fill: "#D6DAEA"}, laptop);
  S("rect", {x: 842, y: 724, width: 236, height: 12, rx: 6, fill: "#BAC0D6"}, laptop);
  S("circle", {cx: 960, cy: 672, r: 11, fill: "#AEB4CC"}, laptop);
  // mug with steam
  const mug = S("g", {}, cam);
  S("rect", {x: 1196, y: 672, width: 52, height: 58, rx: 10, fill: C.warm}, mug);
  S("path", {d: "M1248 686 C1272 686 1272 716 1248 716", stroke: C.warm, "stroke-width": 9, fill: "none"}, mug);
  const steam = S("g", {id: "steam"}, mug);
  for (const x of [1210, 1222, 1234]) S("path", {d: `M${x} 660 C${x - 8} 645 ${x + 8} 635 ${x} 620`, stroke: "#FFFFFF", "stroke-width": 4, "stroke-linecap": "round", fill: "none", opacity: .8}, steam);
  // plant
  const plant = S("g", {id: "plant"}, cam);
  for (const [cx, cy, rx, ry, r, col] of [[640, 640, 16, 46, -24, "#1FA36F"], [668, 628, 16, 52, 6, "#2BBF83"], [694, 642, 16, 44, 30, "#1FA36F"], [654, 664, 14, 36, -48, "#2BBF83"], [684, 662, 14, 36, 50, "#2BBF83"]])
    S("ellipse", {cx, cy, rx, ry, fill: col, transform: `rotate(${r} ${cx} ${cy + ry})`}, plant);
  S("path", {d: "M630 690 L706 690 L696 732 L640 732 Z", fill: C.coral}, plant);
  motion.set(plant, {svgOrigin: "668 730"});

  // falling work items (scene 2), on top of desk area
  const items = S("g", {id: "items"}, cam);
  const spots = [];
  for (let i = 0; i < 16; i++) spots.push([570 + (i % 2) * 60 + rnd() * 30, 726 - Math.floor(i / 2) * 15]);
  for (let i = 0; i < 16; i++) spots.push([1280 + (i % 2) * 50 + rnd() * 30, 726 - Math.floor(i / 2) * 15]);
  for (let i = 0; i < 12; i++) spots.push([120 + rnd() * 330, 1000 - Math.floor(i / 4) * 16 + rnd() * 6]);
  for (let i = 0; i < 12; i++) spots.push([1500 + rnd() * 330, 1000 - Math.floor(i / 4) * 16 + rnd() * 6]);
  window.__items = [];
  spots.forEach(([x, y], i) => {
    const d = pileItem(items, PILE.item, i);
    motion.set(d, {x, y: -160 - rnd() * 300, rotation: (rnd() - .5) * 70, opacity: 1});
    window.__items.push({el: d, x, y: y - 46, rot: (rnd() - .5) * 18});
  });
  // messages crossing
  const env = S("g", {id: "msgs"}, cam);
  window.__msgs = [];
  for (let i = 0; i < 6; i++) {
    const e = S("g", {}, env);
    S("rect", {x: -48, y: -26, width: 96, height: 52, rx: 16, fill: "#FFFFFF", stroke: "#CDD3E4", "stroke-width": 2}, e);
    S("circle", {cx: -26, cy: 0, r: 11, fill: [C.accent2, C.warm, C.alt][i % 3]}, e);
    S("rect", {x: -8, y: -6, width: 40, height: 6, rx: 3, fill: "#D7DCEA"}, e); S("rect", {x: -8, y: 6, width: 28, height: 6, rx: 3, fill: "#D7DCEA"}, e);
    motion.set(e, {x: 2050, y: 200 + i * 70, rotation: -8, opacity: 1});
    window.__msgs.push(e);
  }
  // HUD: name tag and counter (not under the camera)
  const hud = S("g", {id: "hud"}, g);

  tl.to(lock, {opacity: 1, scale: 1, duration: .6, ease: "power3.out"}, e + .4); cue(e + .4, "jingle_out");
}

/* ---------- build ---------- */
async function main() {
  await Promise.all([
    document.fonts.load('700 40px "Space Grotesk"'), document.fonts.load('500 40px "IBM Plex Sans"'), document.fonts.load('600 40px "IBM Plex Sans"'),
    document.fonts.load('700 40px "IBM Plex Sans"'), document.fonts.load('700 40px "Caveat"')]);
  await document.fonts.ready;
  if (UC.wall) { const st = document.querySelectorAll("#wall stop"); st[0].setAttribute("stop-color", UC.wall[0]); st[1].setAttribute("stop-color", UC.wall[1]); }
  if (BR.logo) await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = BR.logo; });
  buildSetup(); buildApp(); buildBoard(); buildOffice();
  if (ARCH === "B") animPing();
  animOffice(); animBoard(); if (ARCH === "C") animSplit(); animSetup(); animApp();
  tl.set({}, {}, TOTAL);
  tl.seek(0);
  window.TOTAL = TOTAL; window.SFX = SFX.sort((a, b) => a[0] - b[0]);
  window.renderAt = t => { tl.seek(t); };
  window.READY = true;
}
main();
</script>
