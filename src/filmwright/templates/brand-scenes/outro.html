<!doctype html>
<!-- Brand outro. Frame-exact (pure function of time, see runtime.js). Logo, title, tagline, a URL button, the
     series strip and a "Next up" line. Landscape and vertical. PARAMS is injected by the series generator. -->
<html><head><meta charset="utf-8"></head><body>
<script>window.PARAMS = /*PARAMS*/{"title":"Shared Boards","tagline":"Plan less. Ship more.","url":"acme.example","next":"Smart Reminders","episode":1,"of":5,"theme":"main"}/*END*/;</script>
<script src="runtime.js"></script>
<script>
const { W, H, U, vertical, P, ease, seg, lerp, clamp, accent } = Scene;
let r = {};
Scene.define({
  setup(S) {
    const st = S.stage, c = Scene.el("canvas", { width: W, height: H }, st); r.cv = c.getContext("2d");
    r.box = Scene.el("div", { style: "position:absolute;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 " + 24 * U + "px" }, st);
    const rowStyle = "opacity:0;will-change:transform,opacity";
    r.logo = Scene.el("img", { src: "logo.png", style: rowStyle + ";width:" + (vertical ? 70 : 96) + "px;height:" + (vertical ? 70 : 96) + "px;border-radius:" + ((P.brand && P.brand.logo_radius != null) ? Math.round((vertical ? 70 : 96) * P.brand.logo_radius) : (vertical ? 16 : 22)) + "px;box-shadow:0 0 0 1px #343a6b,0 18px 50px rgba(124,92,255,.2)" }, r.box);
    r.title = Scene.el("h1", { class: "serif", text: P.title || "", style: rowStyle + ";margin-top:" + (vertical ? 22 : 34) + "px;font-size:" + (vertical ? 44 : 92) + "px;line-height:1.05;font-weight:700" }, r.box);
    r.tag = Scene.el("p", { text: P.tagline || "", style: rowStyle + ";margin-top:" + (vertical ? 14 : 20) + "px;font-size:" + (vertical ? 16 : 32) + "px" }, r.box);
    r.url = Scene.el("div", { text: P.url || "acme.example", style: rowStyle + ";margin-top:" + (vertical ? 24 : 44) + "px;padding:" + (vertical ? 10 : 16) + "px " + (vertical ? 24 : 38) + "px;border:1.5px solid " + accent + ";border-radius:999px;font-size:" + (vertical ? 18 : 30) + "px;color:" + accent + ";letter-spacing:.02em" }, r.box);
    r.next = Scene.el("div", { style: rowStyle + ";margin-top:" + (vertical ? 18 : 22) + "px;font-size:" + (vertical ? 13 : 23) + "px;color:#a9aecb" }, r.box);
    r.next.innerHTML = P.next ? "Next up · <span style='color:#f4f5fb'>" + P.next + "</span>" : "Follow for more";
    r.strip = Scene.strip(r.box, P.of || 1, P.episode || 1); r.strip.style.position = "static"; r.strip.style.marginTop = (vertical ? 18 : 26) + "px"; r.strip.style.opacity = 0;
    r.foot = Scene.el("p", { text: (P.episode ? "Episode " + P.episode + " of " + P.of + (((P.footer != null) ? P.footer : "") ? " · " : "") : "") + ((P.footer != null) ? P.footer : ""), style: rowStyle + ";margin-top:" + (vertical ? 12 : 18) + "px;font-size:" + (vertical ? 11 : 20) + "px;color:#a9aecb" }, r.box);
  },
  render(t) {
    Scene.field(r.cv, t, { n: vertical ? 60 : 110, alpha: 0.9 });
    const rows = [[r.logo, 0.1, 0.9, 0], [r.title, 0.6, 0.9, 22], [r.tag, 1.3, 0.9, 22], [r.url, 2.1, 0.9, 22], [r.next, 2.7, 0.8, 14], [r.strip, 3.0, 0.8, 8], [r.foot, 3.4, 0.8, 14]];
    rows.forEach(([e, s, d, dy]) => { const k = ease.out(seg(t, s, d)); e.style.opacity = k; e.style.transform = e === r.logo ? "scale(" + (0.82 + 0.18 * ease.back(seg(t, s, d))) + ")" : "translateY(" + dy * U * (1 - k) + "px)"; });
  },
});
</script></body></html>
