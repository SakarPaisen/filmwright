<!doctype html>
<!-- Timeline: an axis (horizontal in landscape, vertical in 9:16) where event markers drop in one by one, each a pill with a
     small icon by kind (person = tie, star = star, work = briefcase, announce = megaphone), building an accent trail that ends at a tag.
     PARAMS: {tag:string (default "LAUNCH"), events:[{kind:"person|star|work|announce", label:string}] (default 6; max 8 used),
              title:string (default "Everything on one timeline"), theme:"main|alt|warm"}
     Pure function of time (see ../runtime.js). -->
<html><head><meta charset="utf-8"></head><body>
<script>window.PARAMS = /*PARAMS*/{"tag":"LAUNCH","events":[{"kind":"person","label":"Kickoff"},{"kind":"work","label":"First draft"},{"kind":"star","label":"Design review"},{"kind":"work","label":"Beta build"},{"kind":"person","label":"User tests"},{"kind":"announce","label":"Announcement"}],"title":"Everything on one timeline","theme":"main"}/*END*/;</script>
<script src="../runtime.js"></script>
<script>
const { W, H, U, vertical, P, ease, seg, lerp, clamp, accent, D } = Scene;
const ACC = "#7c5cff", COL = { person: "#7db4ff", star: "#5fd3a0", work: "#b79cff", announce: "#ff9f7a" };
const ICON = {
  person: (c) => '<path d="M9.5 3h5l-1 3h-3z M10.5 7h3l2 10-3.5 4-3.5-4z" fill="' + c + '"/>',
  star: (c) => '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" fill="' + c + '"/>',
  work: (c) => '<rect x="3.5" y="8" width="17" height="11.5" rx="2.2" fill="' + c + '"/><path d="M9 8V6.2c0-.7.5-1.2 1.2-1.2h3.6c.7 0 1.2.5 1.2 1.2V8" fill="none" stroke="' + c + '" stroke-width="1.8"/>',
  announce: (c) => '<path d="M4 10v4h3l7 4V6L7 10z" fill="' + c + '"/><path d="M17 9.5c1.3 1.2 1.3 3.8 0 5" fill="none" stroke="' + c + '" stroke-width="1.8" stroke-linecap="round"/>',
};
const events = ((P.events && P.events.length ? P.events : [{ kind: "person", label: "Kickoff" }, { kind: "work", label: "First draft" }, { kind: "star", label: "Design review" }, { kind: "work", label: "Beta build" }, { kind: "person", label: "User tests" }, { kind: "announce", label: "Announcement" }])).slice(0, 8);
const n = events.length, tagText = P.tag || "LAUNCH", title = P.title || "Everything on one timeline";
// ---- geometry: "a" is the coordinate along the axis
const A0 = vertical ? 0.17 * H : 0.06 * W, AX = vertical ? 0.17 * W : 0.54 * H;
const TAGW = (vertical ? 150 : 210) * U, TAGH = (vertical ? 44 : 64) * U;
const tagC = vertical ? [0.5 * W, 0.9 * H] : [0.865 * W, AX];
const tagEdge = vertical ? tagC[1] - TAGH / 2 : tagC[0] - TAGW / 2, A1 = tagEdge;
const e0 = vertical ? 0.2 * H : 0.1 * W, e1 = vertical ? 0.78 * H : 0.7 * W;
const ea = events.map((_, i) => lerp(e0, e1, n > 1 ? i / (n - 1) : 0.5));
const pt = (a) => vertical ? [AX, a] : [a, AX];
const ts = events.map((_, i) => (0.1 + 0.6 * (n > 1 ? i / (n - 1) : 0)) * D), T_TAG = 0.74 * D;
const FS = vertical ? 14 : (n > 6 ? 19 : 22), PH = (vertical ? 36 : 52) * U;
const level = (i) => [[-1, 70], [1, 70], [-1, 150], [1, 150]][i % 4];
const keys = [[0.04 * D, A0]].concat(events.map((_, i) => [ts[i], ea[i]]), [[T_TAG, A1]]);
const headAt = (t) => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], ease.io(seg(t, keys[i - 1][0], keys[i][0] - keys[i - 1][0]))); return A1; };
let R = {};
Scene.define({
  setup(st) {
    const bg = Scene.el("canvas", { width: W, height: H }, st.stage); R.bg = bg.getContext("2d");
    const sv = Scene.svg("svg", { width: W, height: H, style: "position:absolute;left:0;top:0;overflow:visible" }, st.stage);
    const a = pt(A0), b = pt(A1);
    Scene.svg("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "#282b47", "stroke-width": 3 * U, "stroke-linecap": "round" }, sv);
    for (let k = 0; k <= 24; k++) { const p = pt(lerp(A0, A1, k / 24)), d = (k % 4 ? 4 : 7) * U; Scene.svg("line", { x1: p[0], y1: p[1], x2: vertical ? p[0] - d : p[0], y2: vertical ? p[1] : p[1] + d, stroke: "#282b47", "stroke-width": 1.5 * U }, sv); }
    R.glow = Scene.svg("line", { x1: a[0], y1: a[1], x2: a[0], y2: a[1], stroke: ACC, "stroke-width": 12 * U, "stroke-linecap": "round", opacity: 0.25, style: "filter:blur(" + 7 * U + "px)" }, sv);
    R.trail = Scene.svg("line", { x1: a[0], y1: a[1], x2: a[0], y2: a[1], stroke: ACC, "stroke-width": 4 * U, "stroke-linecap": "round" }, sv);
    R.head = Scene.svg("circle", { cx: a[0], cy: a[1], r: 6 * U, fill: ACC }, sv);
    R.stems = events.map((e, i) => { const c = COL[e.kind] || ACC; return Scene.svg("line", { stroke: c, "stroke-width": 2 * U, opacity: 0.8 }, sv); });
    R.dots = events.map((e, i) => { const p = pt(ea[i]); return Scene.svg("circle", { cx: p[0], cy: p[1], r: 7 * U, fill: "#0f1222", stroke: COL[e.kind] || ACC, "stroke-width": 3 * U, opacity: 0 }, sv); });
    R.title = Scene.el("div", { class: "serif", text: title, style: "position:absolute;left:" + 24 * U + "px;right:" + 24 * U + "px;text-align:center;top:" + (vertical ? 34 : 44) * U + "px;font-weight:700;line-height:1.1;font-size:" + (vertical ? 30 : 46) * U + "px" }, st.stage);
    R.pills = events.map((e, i) => {
      const c = COL[e.kind] || ACC, isz = (vertical ? 22 : 32) * U;
      const d = Scene.el("div", { style: "position:absolute;height:" + PH + "px;display:flex;align-items:center;gap:" + (vertical ? 8 : 12) * U + "px;padding:0 " + (vertical ? 12 : 20) * U + "px 0 " + (vertical ? 7 : 10) * U + "px;border-radius:999px;background:#171a30;border:1.5px solid " + c + ";white-space:nowrap;font-weight:500;font-size:" + FS * U + "px;opacity:0" }, st.stage);
      d.innerHTML = '<span style="display:block;width:' + isz + 'px;height:' + isz + 'px;border-radius:50%;background:' + c + '26;flex:none"><svg viewBox="0 0 24 24" width="100%" height="100%">' + (ICON[e.kind] || ICON.person)(c) + '</svg></span><span>' + e.label + '</span>';
      return d;
    });
    R.tag = Scene.el("div", { text: tagText, style: "position:absolute;left:" + (tagC[0] - TAGW / 2) + "px;top:" + (tagC[1] - TAGH / 2) + "px;width:" + TAGW + "px;height:" + TAGH + "px;display:flex;align-items:center;justify-content:center;border-radius:" + 14 * U + "px;background:#ffffff;border:2px solid " + ACC + ";color:" + ACC + ";font:700 " + (vertical ? 22 : 34) * U + "px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;opacity:0" }, st.stage);
  },
  render(t) {
    Scene.field(R.bg, t, { n: vertical ? 60 : 110, alpha: 0.4 * seg(t, 0, 1.2) });
    const tt = ease.out(seg(t, 0.1, 0.8)); R.title.style.opacity = tt; R.title.style.transform = "translateY(" + 14 * U * (1 - tt) + "px)";
    const h = headAt(t), a = pt(A0), p = pt(h);
    [R.trail, R.glow].forEach((l) => { l.setAttribute("x2", p[0]); l.setAttribute("y2", p[1]); }); R.head.setAttribute("cx", p[0]); R.head.setAttribute("cy", p[1]);
    R.head.setAttribute("opacity", seg(t, 0.04 * D, 0.4)); R.trail.setAttribute("opacity", seg(t, 0.04 * D, 0.4));
    events.forEach((e, i) => {
      const k = ease.back(seg(t, ts[i] - 0.35, 0.6)), o = ease.out(seg(t, ts[i] - 0.35, 0.4));
      const pa = pt(ea[i]), lv = level(i), off = (vertical ? 28 : lv[1]) * U, dir = vertical ? 1 : lv[0];
      const end = vertical ? [pa[0] + off, pa[1]] : [pa[0], pa[1] + dir * off], sk = ease.out(seg(t, ts[i] - 0.35, 0.45));
      R.dots[i].setAttribute("opacity", o); R.dots[i].setAttribute("r", (5 + 3 * k) * U);
      R.stems[i].setAttribute("x1", pa[0]); R.stems[i].setAttribute("y1", pa[1]); R.stems[i].setAttribute("x2", lerp(pa[0], end[0], sk)); R.stems[i].setAttribute("y2", lerp(pa[1], end[1], sk)); R.stems[i].setAttribute("opacity", 0.7 * o);
      const d = R.pills[i], dr = (1 - k) * -26 * U;
      if (vertical) { d.style.left = end[0] + "px"; d.style.top = end[1] + "px"; d.style.transform = "translate(" + (-dr) + "px,-50%)"; }
      else { d.style.left = end[0] + "px"; d.style.transform = "translate(-50%," + (dir < 0 ? "-100%" : "0") + ") translateY(" + dir * (-dr) + "px)"; d.style.top = end[1] + "px"; }
      d.style.opacity = o;
    });
    const tg = ease.back(seg(t, T_TAG, 0.7)), to = ease.out(seg(t, T_TAG, 0.5)), pu = Math.sin(clamp(seg(t, T_TAG + 0.2, 1.2)) * Math.PI);
    R.tag.style.opacity = to; R.tag.style.transform = "scale(" + (0.8 + 0.2 * tg) + ")"; R.tag.style.boxShadow = "0 0 " + (16 + 30 * pu) * U + "px rgba(124,92,255," + (0.2 + 0.3 * pu) + ")";
  },
});
</script></body></html>
