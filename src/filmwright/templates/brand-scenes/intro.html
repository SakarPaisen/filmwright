<!doctype html>
<!-- Brand intro with characters. Frame-exact: every frame is a pure function of time (see runtime.js).
     Cast walk in as the narration names them, land with a little squash, look at the tile; when the last one
     arrives the pattern lights up (surprise + glow links), then the title lands. Landscape and vertical.
     Edit PARAMS below, or let the series generator inject it. -->
<html><head><meta charset="utf-8"></head><body>
<script>window.PARAMS = /*PARAMS*/{"cast":[{"look":"manager","name":"Manager"},{"look":"builder","name":"Builder"},{"look":"marketer","name":"Marketer"},{"look":"you","name":"You"}],
 "head1":"Shared","head2":"Boards","tagline":"Everyone on the team sees the same plan.","episode":1,"of":5,"theme":"main","tile":"trend"}/*END*/;</script>
<script src="runtime.js"></script><script src="characters.js"></script>
<script>
const { W, H, U, vertical, P, ease, seg, lerp, clamp, accent } = Scene;
const cast = P.cast || [], n = cast.length;
// ---- layout ---------------------------------------------------------------------------------------
const L = vertical
  ? { logo: 62, logoY: 40, wordY: 122, wordFs: 20, h1Y: 168, h1Fs: 56, stack: true, tagY: 330, tagFs: 17, ground: H * 0.82, csc: 0.66, tile: 84,
      slots: { 1: [0], 2: [-60, 60], 3: [-94, 0, 94], 4: [-141, -47, 47, 141] } }
  : { logo: 84, logoY: 44, wordY: 142, wordFs: 28, h1Y: 190, h1Fs: 92, stack: false, tagY: 310, tagFs: 27, ground: H * 0.735, csc: 1, tile: 140,
      slots: { 1: [118], 2: [-120, 118], 3: [-120, 118, 252], 4: [-252, -120, 118, 252] } };
const slots = (L.slots[n] || L.slots[4]).map((x) => W / 2 + x);
const tileCx = W / 2 - 2, tileTop = vertical ? L.ground - 200 * L.csc - L.tile - 22 : L.ground - L.tile - 14;
const tS = cast.map((_, i) => 1.0 + 1.1 * i), tE = tS.map((s) => s + 1.4), eLast = tE[tE.length - 1] || 2.4;
const T_TILE = 1.2, T_PATTERN = eLast + 0.05, T_HEAD = eLast + 0.35, T_TAG = T_HEAD + 1.0;
const sides = cast.map((c, i) => (slots[i] < tileCx ? -1 : 1));
const PROPS = ["you", "builder", "marketer", "reviewer", "host", "analyst", "reader"];
let chars = [], labs = [], refs = {};
Scene.define({
  setup(S) {
    const st = S.stage, c = Scene.el("canvas", { width: W, height: H }, st); refs.cv = c.getContext("2d");
    refs.strip = Scene.strip(st, P.of || 1, P.episode || 1); refs.strip.style.left = 56 * U + "px"; refs.strip.style.top = (vertical ? 22 : 62) + "px";
    refs.ep = Scene.el("div", { text: P.episode ? "Episode " + P.episode + " of " + P.of : "", style: "position:absolute;right:" + 56 * U + "px;top:" + (vertical ? 18 : 52) + "px;font:600 " + (vertical ? 10 : 17) + "px 'IBM Plex Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:" + accent + ";border:1px solid #434765;padding:" + (vertical ? 4 : 8) + "px " + (vertical ? 10 : 18) + "px;border-radius:999px" }, st);
    refs.logo = Scene.el("img", { src: "logo.png", style: "position:absolute;left:50%;top:" + L.logoY + "px;width:" + L.logo + "px;height:" + L.logo + "px;margin-left:-" + L.logo / 2 + "px;border-radius:" + L.logo * ((P.brand && P.brand.logo_radius != null) ? P.brand.logo_radius : 0.24) + "px;box-shadow:0 0 0 1px #343a6b,0 18px 50px rgba(124,92,255,.2)" }, st);
    const WM = (P.brand && P.brand.wordmark) || { pre: "ACME", accent: "" };
    refs.word = Scene.el("div", { class: "serif", style: "position:absolute;left:0;right:0;text-align:center;top:" + L.wordY + "px;font-size:" + L.wordFs + "px;" + ((P.brand && P.brand.wordmark_css) || "") }, st);
    refs.word.innerHTML = WM.pre + "<b style='color:#7c5cff;font-weight:" + ((P.brand && P.brand.wordmark_accent_weight) || 400) + "'>" + WM.accent + "</b>";
    const h = Scene.el("div", { class: "serif", style: "position:absolute;left:0;right:0;top:" + L.h1Y + "px;text-align:center;display:flex;flex-direction:" + (L.stack ? "column" : "row") + ";align-items:center;justify-content:center;gap:" + (L.stack ? 0 : 24) + "px;font-weight:700;font-size:" + L.h1Fs + "px;line-height:1.05" }, st);
    refs.w1 = Scene.el("span", { text: P.head1 || "", style: "display:inline-block" }, h); refs.w2 = Scene.el("span", { text: P.head2 || "", style: "display:inline-block" }, h);
    refs.tag = Scene.el("div", { text: P.tagline || "", style: "position:absolute;left:" + 24 * U + "px;right:" + 24 * U + "px;text-align:center;top:" + L.tagY + "px;font-size:" + L.tagFs + "px;color:#a9aecb" }, st);
    Scene.el("div", { style: "position:absolute;left:0;right:0;top:" + L.ground + "px;height:2px;background:linear-gradient(90deg,transparent,#23263f 20%,#23263f 80%,transparent)" }, st);
    refs.tile = Scene.el("div", { style: "position:absolute;left:" + (tileCx - L.tile / 2) + "px;top:" + tileTop + "px;width:" + L.tile + "px;height:" + L.tile + "px;border-radius:" + L.tile * 0.19 + "px;background:#171a30;border:1.5px solid #363a59" }, st);
    const sv = Scene.svg("svg", { width: L.tile, height: L.tile, viewBox: "0 0 140 140" }, refs.tile);
    refs.trend = Scene.svg("polyline", { points: "26,100 52,78 74,88 98,52 116,40", fill: "none", stroke: "#7c5cff", "stroke-width": 7, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": 200, "stroke-dashoffset": 200 }, sv);
    refs.tdot = Scene.svg("circle", { cx: 116, cy: 40, r: 8, fill: "#7c5cff", opacity: 0 }, sv);
    refs.flag = Scene.svg("g", { opacity: 0 }, sv); Scene.svg("line", { x1: 46, y1: 28, x2: 46, y2: 114, stroke: "#7c5cff", "stroke-width": 7, "stroke-linecap": "round" }, refs.flag); refs.flagp = Scene.svg("path", { d: "M50 32 L106 32 L90 54 L106 76 L50 76 Z", fill: "#7c5cff" }, refs.flag);
    if (P.tile === "flag") { refs.trend.setAttribute("display", "none"); refs.tdot.setAttribute("display", "none"); } else refs.flag.setAttribute("display", "none");
    refs.links = Scene.svg("svg", { width: W, height: H, style: "position:absolute;left:0;top:0;pointer-events:none" }, st);
    refs.linkEls = cast.map(() => Scene.svg("line", { stroke: "#7c5cff", "stroke-width": 2.2, "stroke-linecap": "round", opacity: 0 }, refs.links));
    cast.forEach((c, i) => {
      chars.push(Characters.make(c.look, st, i + 1));
      const l = Scene.el("div", { style: "position:absolute;width:" + 150 * L.csc + "px;text-align:center;font-size:" + (vertical ? 13 : 22) + "px;opacity:0;top:" + (L.ground + (vertical ? 22 : 26)) + "px;left:" + (slots[i] - 75 * L.csc) + "px" }, st);
      l.innerHTML = "<i style='font-style:normal;display:inline-block;padding:" + (vertical ? 3 : 5) + "px " + (vertical ? 10 : 16) + "px;border-radius:999px;background:#22264a;border:1px solid #363a59'>" + c.name + "</i>"; labs.push(l);
    });
  },
  render(t) {
    Scene.field(refs.cv, t, { n: vertical ? 70 : 130, alpha: seg(t, 0, 1.0) });
    refs.ep.style.opacity = ease.out(seg(t, 0.6, 0.8)); refs.strip.style.opacity = ease.out(seg(t, 0.6, 0.8));
    const lg = ease.out(seg(t, 0.3, 0.8)); refs.logo.style.opacity = lg; refs.logo.style.transform = "scale(" + (0.6 + 0.4 * ease.back(seg(t, 0.3, 0.8))) + ")";
    const wd = ease.out(seg(t, 0.8, 0.7)); refs.word.style.opacity = wd; refs.word.style.transform = "translateY(" + 12 * (1 - wd) + "px)";
    const tl = ease.out(seg(t, T_TILE, 0.7)); refs.tile.style.opacity = tl; refs.tile.style.transform = "scale(" + (0.8 + 0.2 * tl) + ")";
    const draw = ease.out(seg(t, T_TILE + 0.5, 1.2));
    refs.trend.setAttribute("stroke-dashoffset", 200 * (1 - draw)); refs.tdot.setAttribute("opacity", seg(t, T_TILE + 1.5, 0.4));
    const fl = ease.out(seg(t, T_TILE + 0.5, 0.9)); refs.flag.setAttribute("opacity", fl); refs.flagp.setAttribute("transform", "translate(" + (-14 * (1 - fl)) + " 0)");
    const pat = seg(t, T_PATTERN, 0.9), pulse = Math.sin(clamp(pat) * Math.PI);
    refs.tile.style.boxShadow = "0 0 " + 46 * pulse + "px rgba(124,92,255," + 0.55 * pulse + ")"; refs.tile.style.borderColor = pat > 0 ? accent : "#363a59";
    cast.forEach((c, i) => {
      const k = ease.io(seg(t, tS[i], tE[i] - tS[i])), walking = t > tS[i] && t < tE[i], x0 = sides[i] < 0 ? -90 * U : W + 90 * U, x = lerp(x0, slots[i], k);
      const arrived = t >= tE[i], since = t - tE[i], land = arrived ? Math.max(0, Math.sin(clamp(since / 0.4) * Math.PI)) : 0;
      const jump = t > T_HEAD && t < T_HEAD + 0.9 ? Math.max(0, Math.sin((t - T_HEAD + i * 0.12) * 7)) * 22 : 0;
      const prop = PROPS.includes(c.look), use = arrived && prop ? clamp(since / 0.5) : 0, wave = arrived && !prop && since < 1.4 ? 1 : 0;
      const toward = (tileCx > slots[i] ? 1 : -1);
      chars[i].pose({ t, x, y: L.ground + 2, face: sides[i] < 0 ? 1 : -1, scale: L.csc, walk: walking ? t : 0, moving: walking ? 1 : 0, wave, use,
        look: { x: arrived ? toward * (sides[i] < 0 ? 1 : -1) : 0, y: pat > 0 ? -0.5 : 0 }, surprise: pat > 0 ? Math.sin(clamp(pat * 1.3) * Math.PI) : 0, squash: land, jump });
      chars[i].el.style.opacity = t > tS[i] - 0.1 ? 1 : 0;
      const lb = ease.out(seg(t, tE[i] - 0.3, 0.45)); labs[i].style.opacity = lb; labs[i].style.transform = "translateY(" + 10 * (1 - lb) + "px)";
      const ln = refs.linkEls[i], gx = slots[i], gy = L.ground - 200 * L.csc * 0.7, e = ease.out(seg(t, T_PATTERN, 0.5));
      ln.setAttribute("x1", gx); ln.setAttribute("y1", gy); ln.setAttribute("x2", lerp(gx, tileCx, e)); ln.setAttribute("y2", lerp(gy, tileTop + L.tile / 2, e));
      ln.setAttribute("opacity", seg(t, T_PATTERN, 0.5) * (1 - 0.6 * seg(t, T_HEAD + 0.8, 0.8)));
    });
    [[refs.w1, T_HEAD], [refs.w2, T_HEAD + 0.35]].forEach(([e, s]) => { const k = ease.out(seg(t, s, 0.8)); e.style.opacity = k; e.style.transform = "translateY(" + 46 * U * (1 - k) + "px)"; e.style.filter = "blur(" + 14 * U * (1 - k) + "px)"; });
    const tg = ease.out(seg(t, T_TAG, 0.7)); refs.tag.style.opacity = tg; refs.tag.style.transform = "translateY(" + 12 * U * (1 - tg) + "px)";
  },
});
</script></body></html>
